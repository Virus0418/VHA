<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>VHA 卡片 — 预览</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #f4f4f6;
        color: #111111;
        font-family: "Geist", "Noto Sans SC", "PingFang SC", sans-serif;
      }
      .page { max-width: 1100px; margin: 0 auto; padding: 36px 20px 64px; }
      h1 { font-size: 28px; line-height: 34px; font-weight: 500; margin: 0 0 8px; letter-spacing: -0.3px; }
      .lead { margin: 0 0 28px; color: #6B6C6F; font-size: 16px; line-height: 24px; }
      section { margin: 0 0 36px; }
      h2 { margin: 0 0 12px; font-size: 16px; font-weight: 500; color: #3A3A3C; }
      .grid { display: flex; flex-wrap: wrap; gap: 24px; align-items: stretch; }
      .grid.hug { align-items: flex-start; }
      .slot { min-width: 0; }
      .slot.large { width: min(100%, 448px); }
      .slot.narrow { width: 240px; }
      .slot.vertical { width: min(100%, 220px); }
      .slot.electronics, .slot.media { width: min(100%, 448px); }
      .slot.wide { width: min(100%, 480px); }
      .slot.squeeze { width: 220px; }
      .slot.editor { width: min(100%, 420px); background: #fff; border-radius: 24px; padding: 16px; }
      .slot.dark {
        width: min(100%, 448px);
        background: #1c1c1e;
        border-radius: 28px;
        padding: 16px;
        color: #f2f2f4;
        --primary-text-color: #f2f2f4;
        --secondary-text-color: #c7c7cc;
        --card-background-color: #1c1c1e;
        --ha-card-background: #1c1c1e;
        --ha-card-border-width: 1px;
        --ha-card-border-color: rgba(255, 255, 255, 0.12);
        --divider-color: rgba(255, 255, 255, 0.12);
      }
      .slot.dark h2 { color: #f2f2f4; }
      vha-device-card { display: block; height: 100%; }
    </style>
  </head>
  <body>
    <div class="page">
      <h1>VHA 卡片</h1>
      <p class="lead">设备卡仍是原来的三种排版。下面另有气候、传感器和媒体卡：制热 / 制冷、关闭后仍可点的模式芯片、两种传感器排版、播放与空闲，以及不可用和窄栏。</p>
      <div id="app"></div>
    </div>
    <script type="module" src="/src/preview.ts"></script>
  </body>
</html>
